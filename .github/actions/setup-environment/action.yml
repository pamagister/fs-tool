name: Setup Environment

description: Setup uv environment

inputs:
  python-version:
    description: 'Python version to use'
    required: true
    default: '3.11'
  extra:
    description: 'Optional dependency extra to install (e.g. metadata)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Sync dependencies
      run: |
        uv sync --all-groups
        if [ -n "${{ inputs.extra }}" ]; then uv sync --extra "${{ inputs.extra }}"; fi
      shell: bash
