name: Setup Environment

description: Setup uv environment

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Sync dependencies
      run: uv sync --all-groups --all-extras
      shell: bash
