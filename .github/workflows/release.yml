name: Upload Python Package
permissions:
  contents: write

on:
  # Push events to matching tags, i.e. v1.0, v20.15.10
  tags:
    - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 fetches all history so that commit messages can be read
          fetch-depth: 0
      - name: Generate changelog
        run: git log --pretty=format:'- %s (%h)' -100 > release_message.md
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_message.md

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools needs the Git tags for the version number
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # install build for modern packaging, and twine
        pip install build twine
    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        # Use 'python -m build' for modern packaging
        python -m build
        twine upload dist/*
