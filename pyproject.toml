[project]
name = "fs-tool-cli"
dynamic = ["version"]
description = "Lightweight, secure CLI for inspecting and organizing local filesystems."
authors = [
    {name = "pamagister"}
]
readme = "docs/index.md"
requires-python = ">=3.11"
# click<8.2: typer 0.12 renders help via param.make_metavar(), which click 8.2
# changed to require a context argument (typer 0.12 calls it without one).
dependencies = [
    "click>=8.1,<8.2",
    "typer>=0.12,<0.13",
]

[project.optional-dependencies]
metadata = ["pypdf>=5,<6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-mock>=3",
    "coverage>=7",
    "mypy>=1",
    "ruff>=0.8",
]

docs = [
    "mkdocs>=1.6",
    "mkdocs-awesome-nav>=2.6",
    "pygments>=2.18",
]

[project.scripts]
fs-tool = "fs_tool.cli:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/fs-tool/docs" = ["docs/.nav.yml", "docs/index.md"]
"share/fs-tool/docs/css" = ["docs/css/*"]
"share/fs-tool/docs/develop" = ["docs/develop/*.md", "docs/develop/.nav.yml"]
"share/fs-tool/docs/develop/initial-release" = ["docs/develop/initial-release/*"]
"share/fs-tool/docs/funding" = ["docs/funding/*"]
"share/fs-tool/docs/getting-started" = ["docs/getting-started/*"]
"share/fs-tool/docs/_static/img" = ["docs/_static/img/*"]
"share/fs-tool/docs/usage" = ["docs/usage/*"]
"share/fs-tool/res/example_filesystem_unstructured" = [
    "res/example_filesystem_unstructured/Auslandssemester.docx",
    "res/example_filesystem_unstructured/Barcelona Sehenswertes.docx",
    "res/example_filesystem_unstructured/Der Goldschatz partygame.pdf",
    "res/example_filesystem_unstructured/Reise-Checkliste.odt",
    "res/example_filesystem_unstructured/Sauna_Aufriss.odg",
    "res/example_filesystem_unstructured/Tokensystem Zähneputzen.odt",
]
"share/fs-tool/res/example_filesystem_unstructured/Beruf" = [
    "res/example_filesystem_unstructured/Beruf/Bewerbungen.txt",
]
"share/fs-tool/res/example_filesystem_unstructured/Freizeit" = [
    "res/example_filesystem_unstructured/Freizeit/Ablauf Freitag Grundschule.docx",
    "res/example_filesystem_unstructured/Freizeit/Dresdner Christstollen.pdf",
    "res/example_filesystem_unstructured/Freizeit/Kirschkuchen.pdf",
    "res/example_filesystem_unstructured/Freizeit/Pelmeni.odt",
    "res/example_filesystem_unstructured/Freizeit/Seemeilenbestaetigung.pdf",
    "res/example_filesystem_unstructured/Freizeit/Tidal Prediction Form.pdf",
]
"share/fs-tool/res/example_filesystem_unstructured/Freizeit/Projekte" = [
    "res/example_filesystem_unstructured/Freizeit/Projekte/Sauna_Grundriss.odg",
]
"share/fs-tool/res/example_filesystem_unstructured/Reise/Segeln" = [
    "res/example_filesystem_unstructured/Reise/Segeln/Segeln Ibiza 2024.gpx",
]
"share/fs-tool/res/example_filesystem_unstructured/Reise/Segeln/Dalmatien 2018" = [
    "res/example_filesystem_unstructured/Reise/Segeln/Dalmatien 2018/2017-08-26_19-18_Sat.gpx",
]
"share/fs-tool/res/example_filesystem_unstructured/Reise/Slowenien" = [
    "res/example_filesystem_unstructured/Reise/Slowenien/Klettersteige Slowenien.gpx",
]
"share/fs-tool/res/example_filesystem_unstructured/Schule" = [
    "res/example_filesystem_unstructured/Schule/Antrag Schülerausweis.docx",
]
"share/fs-tool/res/example_filesystem_unstructured/Studium" = [
    "res/example_filesystem_unstructured/Studium/Oberseminare 2009 Helduser.pdf",
]
"share/fs-tool/res/example_filesystem_unstructured/Urlaub" = [
    "res/example_filesystem_unstructured/Urlaub/Der Weg zum SHS.ods",
]
"share/fs-tool/res/example_filesystem_unstructured/Urlaub/Italien" = [
    "res/example_filesystem_unstructured/Urlaub/Italien/Klettersteige Italien 2024.kmz",
]
"share/fs-tool/res/example_filesystem_unstructured/Urlaub/Radtouren" = [
    "res/example_filesystem_unstructured/Urlaub/Radtouren/Gittersee-steinbach.gpx",
    "res/example_filesystem_unstructured/Urlaub/Radtouren/SingletrailDresdenerHeide.gpx",
    "res/example_filesystem_unstructured/Urlaub/Radtouren/StauseeInDerDresdnerHeide.gpx",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E721", "UP015", "B008", "B009", "B905"]  # B008: typer.Option() defaults are the canonical Typer pattern

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == \"__main__\":",
]
